# Branches the CI follows: <owner/repo> <branch>. Read by ci/poll-and-dispatch.sh from
# this file on GitHub master every tick, so adding a line here is all it takes.
# A branch outside brainmatt/mattx is followed until its PR into brainmatt/mattx is merged
# (or the branch is deleted); remove its line once it has, to keep the file tidy.
# Integration branches (several fix branches merged together, e.g. integration/pending-fixes)
# are never "merged": add and remove those by hand.
brainmatt/mattx 1.9-dev
brainmatt/mattx main
KrisBuytaert/mattx fix/gettid-thread-tids
KrisBuytaert/mattx fix/epoll-wait-per-thread
KrisBuytaert/mattx integration/pending-fixes

[http]
host = "0.0.0.0"
port = 8090

[sinks.database]
enabled = true
type = "db"
url = "postgresql://cdviz:postgres-password@postgres:5432/cdviz"

[sources.cdevents]
enabled = true

[sources.cdevents.extractor]
type = "webhook"
id = "cdevents"

[sources.cdevents.extractor.headers]
"X-Api-Key" = { type = "equals", value = "localdevkey-0123456789", case_sensitive = true }

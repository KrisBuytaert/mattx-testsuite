# Full MattX regression run on the libvirt host, dispatched by
# ci/poll-and-dispatch.sh when a new mattx or testsuite commit appears.
# Runs on the host-executor runner (label mattx-host, user forgejo-runner-mattx).
#
# Persistent state lives under $HOME/harness (= /var/lib/forgejo-runner-mattx/harness),
# NOT in the job workspace: .stamp/ (which VMs/networks exist), keys/ (the VM ssh
# key), reports/ (the full report history the published page is built from) and
# crash-dumps/. The workspace checkout is rsynced over the code only.
#
# Jobs, in order: `functional` (build + deploy + fast suites, published as soon as it
# finishes), `gate`, then `eessi` (the long EESSI application suites, published again).
# The gate lets the long suites run only if functional succeeded and neither mattx nor
# the testsuite has a newer commit than the one tested: a busy branch gets the fast
# suites per push, and the long ones once it has been quiet (see the poller's
# QUIET_HOURS). `record` always runs last so the poller does not retrigger a run that
# broke early.
name: mattx-ci
on:
  workflow_dispatch:
    inputs:
      mattx_ref:
        description: "mattx branch to test (1.9-dev or main)"
        required: false
        default: "1.9-dev"
      mattx_sha:
        description: "exact mattx commit (overrides mattx_ref)"
        required: false
        default: ""
      run_eessi:
        description: "run the long EESSI suites after the functional ones (true/false)"
        required: false
        default: "true"

concurrency:
  group: mattx-cluster
  cancel-in-progress: false

jobs:
  functional:
    runs-on: mattx-host
    timeout-minutes: 120
    env:
      H: /var/lib/forgejo-runner-mattx/harness
      PAGES_KEY: /var/lib/forgejo-runner-mattx/pages_deploy
    steps:
      - uses: actions/checkout@v4

      - name: Sync harness code into the persistent directory
        run: |
          [ -f "$H/keys/mattx_test" ] || { echo "harness not provisioned: $H/keys/mattx_test missing" >&2; exit 1; }
          [ -d "$H/.stamp" ] || { echo "harness not provisioned: $H/.stamp missing (seed it from the existing VMs)" >&2; exit 1; }
          rsync -a --delete --exclude=.git --exclude=.stamp --exclude=keys --exclude=reports --exclude=crash-dumps ./ "$H/"
          mkdir -p "$H/reports" "$H/crash-dumps"
          git rev-parse HEAD > "$H/.testsuite-sha"
          touch "$H/.run-start"

      - name: Fetch mattx source at the requested commit
        run: |
          S="$HOME/mattx-src"
          [ -d "$S/.git" ] || git clone -q https://github.com/brainmatt/mattx "$S"
          git -C "$S" fetch -q --all --prune
          ref="${{ inputs.mattx_sha }}"
          [ -n "$ref" ] || ref="origin/${{ inputs.mattx_ref || '1.9-dev' }}"
          git -C "$S" checkout -q --force "$ref"
          git -C "$S" log --oneline -1

      - name: Build and deploy to the nodes
        run: cd "$H" && MATTX_SRC="$HOME/mattx-src/" make upgrade-alma3

      - name: Functional suites (run-tests, dsm, stale-link, mesi3)
        continue-on-error: true
        run: cd "$H" && MATTX_SRC="$HOME/mattx-src/" make -k test-alma test-dsm-alma test-stale-link-alma test-dsm-mesi3-alma

      - name: Fetch crash dumps
        if: always()
        run: cd "$H" && for n in 1 2 3; do DUMP_MODE=dmesg KEEP_ON_NODE=3 scripts/fetch-crash-dump.sh alma $n || true; done

      - name: Publish reports (functional)
        if: always()
        run: cd "$H" && scripts/publish-pages.sh

  gate:
    needs: functional
    if: always()
    runs-on: mattx-host
    outputs:
      reason: ${{ steps.g.outputs.reason }}
    steps:
      - id: g
        run: |
          b="${{ inputs.mattx_ref || '1.9-dev' }}"
          H=/var/lib/forgejo-runner-mattx/harness
          reason=ok
          if [ "${{ inputs.run_eessi }}" = false ]; then reason=disabled
          elif [ "${{ needs.functional.result }}" != success ]; then reason=functional-failed
          else
            tested=$(git -C "$HOME/mattx-src" rev-parse HEAD)
            tip=$(git ls-remote https://github.com/brainmatt/mattx "refs/heads/$b" | cut -f1)
            tests=$(git ls-remote https://github.com/KrisBuytaert/mattx-testsuite refs/heads/master | cut -f1)
            # a pinned mattx_sha is a deliberate one-off: only the testsuite tip is checked
            if [ -z "${{ inputs.mattx_sha }}" ] && [ -n "$tip" ] && [ "$tip" != "$tested" ]; then reason=moved
            elif [ -n "$tests" ] && [ "$tests" != "$(cat "$H/.testsuite-sha")" ]; then reason=moved
            fi
          fi
          echo "gate: $reason"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

  eessi:
    needs: gate
    if: ${{ needs.gate.outputs.reason == 'ok' }}
    runs-on: mattx-host
    timeout-minutes: 240
    env:
      H: /var/lib/forgejo-runner-mattx/harness
      PAGES_KEY: /var/lib/forgejo-runner-mattx/pages_deploy
    steps:
      - name: EESSI suites
        continue-on-error: true
        run: cd "$H" && MATTX_SRC="$HOME/mattx-src/" make -k test-eessi-alma

      - name: Fetch crash dumps
        if: always()
        run: cd "$H" && for n in 1 2 3; do DUMP_MODE=dmesg KEEP_ON_NODE=3 scripts/fetch-crash-dump.sh alma $n || true; done

      - name: Publish reports (eessi)
        if: always()
        run: cd "$H" && scripts/publish-pages.sh

  record:
    needs: [functional, gate, eessi]
    if: always()
    runs-on: mattx-host
    steps:
      - name: Record tested pair
        run: |
          H=/var/lib/forgejo-runner-mattx/harness
          b="${{ inputs.mattx_ref || '1.9-dev' }}"
          echo "$(git -C "$HOME/mattx-src" rev-parse HEAD) $(cat "$H/.testsuite-sha")" > "$HOME/last-tested.$b"
          # Always recorded (so a broken deploy is not retried every poll); the result is kept alongside.
          echo "functional=${{ needs.functional.result }} eessi=${{ needs.eessi.result }} gate=${{ needs.gate.outputs.reason }}" > "$HOME/last-result.$b"
          # The long suites are "done" for this pair unless the gate held them back because
          # something newer arrived; the poller reruns those once the branch is quiet.
          if [ "${{ needs.gate.outputs.reason }}" != moved ]; then cp "$HOME/last-tested.$b" "$HOME/last-eessi.$b"; fi

  notify:
    needs: [functional, gate, eessi, record]
    if: always()
    runs-on: mattx-host
    steps:
      - name: Telegram summary
        run: |
          H=/var/lib/forgejo-runner-mattx/harness
          # the checkout is not needed; the script lives in the persistent harness copy
          H=$H "$H/ci/notify-telegram.sh" "${{ inputs.mattx_ref || '1.9-dev' }}" "${{ needs.functional.result }}" "${{ needs.eessi.result }}" "${{ github.run_number }}"

# Read-only smoke test of the mattx-host runner: who it runs as, whether it can
# reach libvirt, and what the harness would find. Changes nothing. Output goes
# to /tmp/mattx-runner-smoke.log (world-readable) so it can be read without
# access to the Forgejo job logs.
name: runner-smoke
on: workflow_dispatch

jobs:
  smoke:
    runs-on: mattx-host
    steps:
      - name: probe
        shell: bash
        run: |
          out=/tmp/mattx-runner-smoke.log
          {
            echo "== identity"; id; hostname; echo "HOME=$HOME PWD=$PWD"
            echo "== libvirt domains"; virsh -c qemu:///system list --all 2>&1
            echo "== libvirt networks"; virsh -c qemu:///system net-list --all 2>&1
            echo "== tools"
            for c in virsh virt-install qemu-img rsync ssh curl make git python3; do
              printf '%s -> ' "$c"; command -v "$c" || echo MISSING
            done
            echo "== harness (persistent dir)"
            H=$HOME/harness
            ls -ld "$H" "$H/keys/mattx_test" "$HOME/pages_deploy" 2>&1
            echo "stamps: $(ls "$H/.stamp" 2>&1 | tr '\n' ' ')"
            echo "reports: $(ls "$H"/reports/*.txt 2>/dev/null | wc -l)"
            echo "== ssh to nodes with the harness key"
            for ip in 11 12 13; do
              printf '192.168.100.%s -> ' "$ip"
              ssh -i "$H/keys/mattx_test" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mattx@192.168.100.$ip 'uname -r' 2>&1 | tail -1
            done
            echo "== pages deploy key can authenticate to github"
            GIT_SSH_COMMAND="ssh -i $HOME/pages_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git ls-remote git@github.com:KrisBuytaert/mattx-test-reports.git HEAD 2>&1 | tail -1
          } > "$out" 2>&1
          chmod 644 "$out"
          cat "$out"

# Read-only smoke test of the mattx-host runner: who it runs as, whether it can
# reach libvirt, and what the harness would find. Changes nothing.
name: runner-smoke
on: workflow_dispatch

jobs:
  smoke:
    runs-on: mattx-host
    steps:
      - name: identity
        run: id; hostname; echo "HOME=$HOME PWD=$PWD"
      - name: libvirt
        run: virsh -c qemu:///system list --all
      - name: libvirt networks
        run: virsh -c qemu:///system net-list --all
      - name: tools the harness needs
        run: |
          for c in virsh virt-install qemu-img rsync ssh curl make git python3; do
            printf '%s -> ' "$c"; command -v "$c" || echo MISSING
          done
      - name: harness inputs
        run: |
          echo "PAGES_KEY=${PAGES_KEY:-unset}"; [ -n "${PAGES_KEY:-}" ] && ls -l "$PAGES_KEY" | cut -c1-10,30-
          echo "MATTX_KEY=${MATTX_KEY:-unset}"
          ls -ld /var/lib/libvirt/images 2>&1 | head -1
          ls -l keys 2>&1 | head -3
